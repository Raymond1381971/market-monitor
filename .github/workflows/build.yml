name: Build dashboard

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC weekdays = 6:30pm EDT / 5:30pm EST, after the US close
  workflow_dispatch:           # "Run workflow" button for an on-demand refresh
  push:
    branches: [main]
    paths: ["config.yaml", "build.py", "template.html", "requirements.txt", ".github/workflows/**"]

permissions:
  contents: write    # heartbeat commit that keeps the schedule from being paused
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      HAS_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch data and build page
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          HOLDINGS_CSV: ${{ secrets.HOLDINGS_CSV }}
        run: python build.py --out site

      - name: Password-protect the page
        if: env.HAS_PASSWORD == 'true'
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          SALT=$(printf 'market-monitor:%s' "$DASHBOARD_PASSWORD" | sha256sum | cut -c1-32)
          npx --yes staticrypt@3 site/index.html -p "$DASHBOARD_PASSWORD" --salt "$SALT" \
            --short --remember 30 --config false -d site_locked \
            --template-title "Market monitor" --template-instructions "Enter the dashboard password."
          mv site_locked/index.html site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Keep the schedule active
        if: github.event_name == 'schedule'
        run: |
          # GitHub pauses scheduled workflows after 60 days without repository activity.
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 40 * 86400 )) ]; then
            date -u +%FT%TZ > .last_run
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add .last_run && git commit -m "Heartbeat" && git push
          fi
